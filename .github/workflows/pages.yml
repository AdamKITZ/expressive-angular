name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:lib
      - run: npx ng build showcase --base-href /expressive-angular/
      # GitHub Pages has no SPA fallback; its 404 page serves the app so deep links like /reference/button load.
      - run: cp dist/showcase/browser/index.html dist/showcase/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/showcase/browser
      - id: deployment
        uses: actions/deploy-pages@v4
