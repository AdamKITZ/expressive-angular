name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Check that the tag matches the library version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./projects/expressive-angular/package.json').version")"
      - run: npm run build:lib
      - run: cp LICENSE README.md dist/expressive-angular/
      - run: npm publish --provenance --access public
        working-directory: dist/expressive-angular
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
