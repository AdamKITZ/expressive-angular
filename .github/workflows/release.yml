name: Release

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Read the library version
        run: echo "VERSION=$(node -p "require('./projects/expressive-angular/package.json').version")" >> "$GITHUB_ENV"
      - run: npm run build:lib
      - run: cp LICENSE NOTICE README.md dist/expressive-angular/
      # Authenticates through npm Trusted Publishing (OIDC, `id-token: write`), which also adds provenance.
      - run: npm publish --access public
        working-directory: dist/expressive-angular
      - run: gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
